<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Volunteer Form</title>
</head>
<body>

    <h1>Volunteer Form</h1>

    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
        
        <!-- Hidden field submitting your name -->
        <input type="hidden" name="hidden_field" value="Zackery Smith">

        <fieldset>
            <legend>My Info</legend>
            
            <div>
                <label for="first_name">first name:</label>
                <input type="text" id="first_name" name="first_name_field" required>
            </div>
            
            <div>
                <label for="last_name">last name:</label>
                <input type="text" id="last_name" name="last_name_field" required>
            </div>
            
            <div>
                <label for="phone">phone:</label>
                <input type="text" id="phone" name="phone_field" required>
            </div>
            
            <div>
                <label for="email">email:</label>
                <input type="email" id="email" name="email_field" required>
            </div>
            
            <fieldset>
                <legend>Gender:</legend>
                <label><input type="radio" name="gender_field" value="Male"> Male</label>
                <label><input type="radio" name="gender_field" value="Female"> Female</label>
            </fieldset>

            <div>
                <label for="age">Age:</label>
                <select id="age" name="age_field">
                    <option value="under 18">under 18</option>
                    <option value="over 18">over 18</option>
                </select>
            </div>
        </fieldset>

        <fieldset>
            <legend>My Availability</legend>
            
            <fieldset>
                <legend>Days Available:</legend>
                <label><input type="checkbox" name="available_field[]" value="Sunday"> Sunday</label><br>
                <label><input type="checkbox" name="available_field[]" value="Monday"> Monday</label><br>
                <label><input type="checkbox" name="available_field[]" value="Tuesday"> Tuesday</label><br>
                <label><input type="checkbox" name="available_field[]" value="Wednesday"> Wednesday</label><br>
                <label><input type="checkbox" name="available_field[]" value="Thursday"> Thursday</label><br>
                <label><input type="checkbox" name="available_field[]" value="Friday"> Friday</label><br>
                <label><input type="checkbox" name="available_field[]" value="Saturday"> Saturday</label>
            </fieldset>

            <div>
                <label for="comments">Comments</label><br>
                <textarea id="comments" name="comments_field" rows="4" cols="30"></textarea>
            </div>
        </fieldset>

        <div>
            <input type="submit" value="Submit Query">
        </div>

    </form>

</body>
</html>
